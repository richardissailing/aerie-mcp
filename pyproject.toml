[project]
name = "falcon-fleet-mcp"
version = "0.1.0"
description = "Serverless multi-tenant CrowdStrike Falcon MCP server with IAM Identity Center sign-in"
readme = "README.md"
authors = [
    { name = "Richard Kirkham", email = "richardissailing@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.118",
    "crowdstrike-falconpy>=1.6.6",
    "httpx>=0.28.1",
    "mcp>=2.3",
    "pyjwt[crypto]>=2.15.1",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto>=5.2.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["tests"]
